<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 512px; height: 512px; overflow: hidden; }
  body {
    font-family: 'Cinzel', serif;
    color: #fff;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  .frame { position: absolute; inset: 18px; border: 2px solid #fff; }
  .frame:before { content: ''; position: absolute; inset: 6px; border: 1px solid rgba(255,255,255,0.45); }
  .corner { position: absolute; width: 13px; height: 13px; border: 2px solid #fff; transform: rotate(45deg); }
  .tl { top: 10px; left: 10px; }
  .tr { top: 10px; right: 10px; }
  .bl { bottom: 10px; left: 10px; }
  .br { bottom: 10px; right: 10px; }
  .center { position: relative; text-align: center; }
  .vrh {
    display: block;
    width: 420px;
    margin: 0 auto;
  }
  .name { margin-top: 12px; font-size: 15px; letter-spacing: 0.4em; color: #d9d9d9; text-indent: 0.4em; }
</style>
</head>
<body>
  <div class="frame"></div>
  <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>

  <div class="center">
    <img class="vrh" src="vrh-white.png" alt="VRH">
    <div class="name">SEVEN KINGDOMS</div>
  </div>
</body>
</html>
