<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2000px; height: 1126px; overflow: hidden; }
  body {
    font-family: 'Cinzel', serif;
    color: #fff;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  .frame { position: absolute; inset: 40px; border: 2px solid #fff; }
  .frame:before { content: ''; position: absolute; inset: 9px; border: 1px solid rgba(255,255,255,0.45); }
  .corner { position: absolute; width: 20px; height: 20px; border: 3px solid #fff; transform: rotate(45deg); }
  .tl { top: 24px; left: 24px; }
  .tr { top: 24px; right: 24px; }
  .bl { bottom: 24px; left: 24px; }
  .br { bottom: 24px; right: 24px; }

  .center { position: relative; text-align: center; }
  .vrh {
    display: block;
    margin: 0 auto;
    width: 860px;
  }
  .rule { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 16px 0 13px; }
  .rule span { display: block; width: 150px; height: 1px; background: linear-gradient(90deg, rgba(255,255,255,0), #fff, rgba(255,255,255,0)); }
  .rule i { color: #fff; font-style: normal; font-size: 12px; }
  .sub { font-size: 19px; letter-spacing: 0.5em; color: #fff; text-indent: 0.5em; }
  .tag { margin-top: 16px; font-family: 'Lora', serif; font-style: italic; font-size: 20px; letter-spacing: 0.1em; color: #d9d9d9; }
  .foot { margin-top: 26px; font-size: 17px; letter-spacing: 0.32em; color: #a3a3a3; text-indent: 0.32em; }
  .foot b { color: #fff; font-weight: 600; }
</style>
</head>
<body>
  <div class="frame"></div>
  <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>

  <div class="center">
    <img class="vrh" src="vrh-white.png" alt="VRH">
    <div class="rule"><span></span><i>&#9670;</i><span></span></div>
    <div class="sub">THE SEVEN KINGDOMS</div>
    <div class="tag">&ldquo;The Dark Yields to Us&rdquo;</div>
    <div class="foot">VRCHAT ROLEPLAY &nbsp;&middot;&nbsp; <b>discord.gg/2j9Zs5wPbV</b></div>
  </div>
</body>
</html>
